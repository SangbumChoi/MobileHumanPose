[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilehumanpose"
version = "0.1.0"
description = "MobileHumanPose"
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "tqdm",
    "torch",
    "torchvision",
    "torchsummary",
    "opencv-python",
    "matplotlib",
    "pycocotools",
    "scipy",
    "gradio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "common*", "data*", "demo*"]

[tool.ruff]
line-length = 120
target-version = "py37"
exclude = ["tool/", "vis/", "output/", "scripts/", "demo/models/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # line too long
    "F403",   # star import
    "F401",   # unused import
    "F405",   # star import may be undefined
    "F841",   # unused variable
    "E741",   # ambiguous variable name `l`
    "E702",   # multiple statements (semicolon)
    "E701",   # multiple statements (colon)
    "E402",   # module import not at top
    "E712",   # comparison to True
    "E731",   # do not assign lambda (use def)
]
